# Publishes the claude-code image to the GitHub Container Registry, so that
# running it is `docker run ghcr.io/<owner>/claude-code:<version>` and not a
# local build first. Only claude-code is published: custom/ is an example
# meant to be copied and edited (README.md), and an image nobody should pull
# as it stands has no place in a registry.
#
# Everything the run needs is in the repository: the tag comes from the
# version the Dockerfile pins, and the credentials are the token GitHub
# gives the job. There is nothing to configure and no secret to create.
name: publish

on:
  push:
    branches: [main]
    # What the image contains is decided by its Dockerfile and by the script
    # that reads its version, so a push touching neither would republish the
    # same content under the same tag. This file is in the list so that a
    # change to it is exercised by the change itself.
    paths:
      - claude-code/**
      - scripts/image-version.sh
      - .github/workflows/publish.yml
  workflow_dispatch:

# The token the job receives is read-only by default. Writing a package is
# the single right added to it; contents stays read, which is all the
# checkout needs.
permissions:
  contents: read
  packages: write

# One publish at a time, and a run already writing to the registry is left
# to finish rather than cancelled halfway, so that no tag is left pointing
# at a half-pushed manifest.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # The runner is pinned like everything else in this repository:
    # "ubuntu-latest" changes what the job runs on without a commit saying
    # so.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned by commit with their release in a comment, for
      # the reason the Dockerfile pins its downloads by digest and checksum:
      # a tag is a moving pointer someone else controls, and what it resolves
      # to here runs with this job's write access to the registry.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag is read from the Dockerfile rather than written here, by the
      # same script the local build uses, so that claude-code:2.1.273 pulled
      # from the registry and built on a workstation hold the same binary.
      # The owner is lowercased because a GitHub login may carry capitals and
      # a registry path may not.
      - name: Read the image name and version
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/claude-code" >> "$GITHUB_OUTPUT"
          echo "version=$(scripts/image-version.sh claude-code)" >> "$GITHUB_OUTPUT"

      # The image is published for amd64 and arm64, the two platforms the
      # Dockerfile provides for with its TARGETARCH switch and its two
      # checksums. The runner is amd64 and QEMU emulates the other one, which
      # on this image costs around a minute: the apt install is what is being
      # emulated, and the 230 MB binary is downloaded, not built. The answer
      # when that stops being cheap is a native arm64 runner building its own
      # half, at the price of a second job and a manifest list to merge.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags. The version is the one to depend on, and names exactly
      # what is inside. latest follows main so that a pull without a tag
      # lands on something, and says nothing about the version it carries.
      #
      # The version tag is overwritten when the image changes without the pin
      # moving, which is the intent: the tag names the Claude Code version,
      # not the Debian packages around it, and a rebuild for a security
      # update has to reach the people already running that version.
      #
      # No layer cache. The build is one apt install and one 230 MB download,
      # it runs only when the image changes, and a cache holding two
      # platforms' layers would be evicted between runs more often than hit.
      #
      # The source label is set here rather than in the Dockerfile, which
      # stays self-contained and forkable: it is what makes the registry
      # attach the package to a repository, so it has to name the repository
      # the workflow is running in.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: claude-code
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
